org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=320m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=96m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Sin daemon: con 7 GB de RAM, el emulador de Wear OS y Android Studio abiertos,
# un daemon persistente de Gradle se queda sin memoria nativa y el JVM crashea.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1

# El proyecto vive en D: y la cache de Gradle en C:. La cache incremental de
# Kotlin falla en ese escenario; se compila en proceso para evitar el problema.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

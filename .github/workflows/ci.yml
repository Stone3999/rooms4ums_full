name: ROOMS4UMS CI (Prácticas 13 y 14)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  flutter_mobile:
    name: Flutter Analyze & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rooms4umsmobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --coverage

  wearos_app:
    name: Wear OS Gradle Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wearos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - run: ./gradlew test lint

  backend_api:
    name: Backend NestJS Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backendrooms4ums
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backendrooms4ums/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
